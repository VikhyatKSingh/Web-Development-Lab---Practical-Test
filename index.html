<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Expense Tracker</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
        }
    </style>
</head>
<body class="bg-indigo-50 flex flex-col items-center p-10 font-sma">
    <div class="bg-white min-h-fit min-w-[70vh] border p-2 rounded-xl">

        <span class="font-bold text-2xl text-indigo-700">Student Expense Tracker</span>
        <hr class="mt-5">
        <div class="flex justify-evenly mt-5 gap-2">
            <input id="itemName" class="border border-slate-300 rounded-[5px] focus:outline-none p-2" placeholder="Item Name"/>
            <input id="amount" type="number" class="border border-slate-300 rounded-[5px] focus:outline-none p-2" placeholder="Amount"/>
            <select name="category" id="category" class="border border-slate-300 rounded-[5px] focus:outline-none p-2 w-[150px]">
                <!-- <option value="select">Select</option> -->
                <option value="Food">Food</option>
                <option value="Electricity">Electricity</option>
                <option value="Clothing">Clothing</option>
                <option value="Others">Others</option>
            </select>

            <!-- <input class="border border-slate-300 rounded-[5px] focus:outline-none p-2"/> -->
            <div id="addExpenseBtn" class="bg-indigo-600 p-1 rounded flex justify-center items-center"><span class="text-white font-semibold">Add Expense</span></div>
        </div>

        <div class="bg-indigo-400 mt-5 p-2 rounded-[5px] flex justify-between">
            <div>
                <span class="text-white font-semibold text-l">Filter</span>
                <select name="Filter" id="filter" class=" w-[100px] outline-none rounded p-[3px]">
                    <option value="all">All</option>

                </select>
            </div>

            <div class="font-semibold text-white text-l">
                <span >Total :- </span><span id="total"></span>
            </div>
        </div>


        <div class="w-[100%] border flex flex-col items-center p-3 mt-5" id="itemArea">
            <span class="text-slate-500" id="noSpend">No spend till now</span>

            <span id="text"></span>
        </div>

        <!-- <div class=" w-[100%] bg-slate-100 border border-slate-300 rounded-l px-2 py-2 mt-5">
            <div class="flex flex-col ">

                <span class="text-xl">ddsfsd</span>
                <span class="bg-indigo-200 rounded-[50px] px-2 text-[14px] mt-2 w-fit ">dsfads</span>

                <div class="bg-red-400 text-white p-1 w-fit rounded-[5px]">Delete</div>



            </div>
         </div> -->

    </div>


    


    <script>
        var amount = document.querySelector("#amount")
        var itemName = document.querySelector("#itemName")
        var categories = document.querySelector("#category")
        var filter = document.querySelector("#filter")
        var addExpenseBtn = document.querySelector("#addExpenseBtn")
        var itemArea = document.querySelector("#itemArea")
        var noSpend = document.querySelector("#noSpend")
        var total = document.querySelector("#total")
        var test = document.querySelector("#test")
        var totalAm = 0;

        addExpenseBtn.addEventListener('click', () => {
            var noSpend = document.querySelector("#noSpend")
            var mainD = document.createElement("div")
            var nameCatD = document.createElement('div')
            var priceDeleteD = document.createElement('div')
            var item_name = document.createElement('span')
            var category = document.createElement('span')
            var price = document.createElement('span')
            var delD = document.createElement('div')

            item_name = itemName.value;
            category = categories.value;
            price = amount.value;

            item_name.className = "text-xl"
            category.className = "bg-indigo-200 rounded-[50px] px-2 text-[14px] mt-2 w-fit"

            delD.className = "bg-red-400 text-white p-1 w-fit rounded-[5px]"
            delD.innerHTML = "Delete"

            nameCatD.style.display = "flex"
            nameCatD.style.flexDirection = "column"
            nameCatD.style.gap = "5px"
            nameCatD.append(item_name)

            priceDeleteD.append("₹"+price)

            priceDeleteD.className = "flex gap-2 items-center"

            mainD.className = "items-center w-[100%] bg-slate-100 border border-slate-300 rounded-l px-2 py-2 mt-5 flex justify-between "
            mainD.append(nameCatD)
            mainD.append(priceDeleteD)
            
            itemArea.append(mainD)
            noSpend.style.display = "none";
            totalAm += Number(amount.value);
            
            total.innerHTML =  totalAm

            // text.append = item_name
            

        })



    </script>
</body>
</html>
